<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=0"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- Favicon und App-Icons -->
    <link
      rel="icon"
      type="image/x-icon"
      href="./favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="./favicon/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon/amarex-manifest-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./favicon/amarex-manifest-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="./favicon/site.webmanifest"
    />

    <title>Amarex Webtool</title>

    <!-- Preload CSS -->
    <link
      rel="preload"
      href="../../build/css/masterportal.css"
      as="style"
    />

    <!-- Non-blocking CSS -->
    <link
      rel="stylesheet"
      href="../../build/css/masterportal.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="../../build/css/masterportal.css"
    /></noscript>

    <!-- Preload JavaScript -->
    <link
      rel="preload"
      href="../../build/js/masterportal.js"
      as="script"
    />

    <!-- Defer JS for faster rendering -->
    <script
      src="../../build/js/masterportal.js"
      defer
    ></script>
  </head>
  <body>
    <div id="masterportal-root"></div>
  </body>
</html>
