<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470">
  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; }
    .title { font-size: 16px; font-weight: bold; }
  </style>

  <!-- Farbbalken und Beschriftungen -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="30" height="20" fill="rgb(255,255,255)" />
    <text x="35" y="15">-400 bis 0</text>

    <rect x="0" y="25" width="30" height="20" fill="rgb(220,250,240)" />
    <text x="35" y="40">0 bis 60</text>

    <rect x="0" y="50" width="30" height="20" fill="rgb(190,240,220)" />
    <text x="35" y="65">60 bis 80</text>

    <rect x="0" y="75" width="30" height="20" fill="rgb(150,230,200)" />
    <text x="35" y="90">80 bis 100</text>

    <rect x="0" y="100" width="30" height="20" fill="rgb(120,220,180)" />
    <text x="35" y="115">100 bis 120</text>

    <rect x="0" y="125" width="30" height="20" fill="rgb(90,210,160)" />
    <text x="35" y="140">120 bis 140</text>

    <rect x="0" y="150" width="30" height="20" fill="rgb(60,200,140)" />
    <text x="35" y="165">140 bis 160</text>

    <rect x="0" y="175" width="30" height="20" fill="rgb(40,180,120)" />
    <text x="35" y="190">160 bis 180</text>

    <rect x="0" y="200" width="30" height="20" fill="rgb(20,160,100)" />
    <text x="35" y="215">180 bis 200</text>

    <rect x="0" y="225" width="30" height="20" fill="rgb(10,140,80)" />
    <text x="35" y="240">200 bis 220</text>

    <rect x="0" y="250" width="30" height="20" fill="rgb(10,120,70)" />
    <text x="35" y="265">220 bis 240</text>

    <rect x="0" y="275" width="30" height="20" fill="rgb(10,100,50)" />
    <text x="35" y="290">240 bis 260</text>

    <rect x="0" y="300" width="30" height="20" fill="rgb(10,80,40)" />
    <text x="35" y="315">260 bis 280</text>

    <rect x="0" y="325" width="30" height="20" fill="rgb(0,60,30)" />
    <text x="35" y="340">280 bis 300</text>

    <rect x="0" y="350" width="30" height="20" fill="rgb(0,50,20)" />
    <text x="35" y="365">300 bis 400</text>

    <rect x="0" y="375" width="30" height="20" fill="rgb(0,30,10)" />
    <text x="35" y="390">400 bis 500</text>

    <rect x="0" y="400" width="30" height="20" fill="rgb(0,0,0)" />
    <text x="35" y="415">500 bis 800</text>
  </g>

  <!-- Einheit -->
  <text x="10" y="450">Einheit: mm/Jahr</text>
</svg>
