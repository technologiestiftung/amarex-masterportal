<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; }
    .title { font-size: 16px; font-weight: bold; }
  </style>
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="30" height="20" fill="rgba(36,65,209,1)" />
    <text x="35" y="15">0 bis 20</text>
    
    <rect x="0" y="25" width="30" height="20" fill="rgba(127,148,247,1)" />
    <text x="35" y="40">20 bis 40</text>
    
    <rect x="0" y="50" width="30" height="20" fill="rgba(240,151,130,1)" />
    <text x="35" y="65">40 bis 60</text>
    
    <rect x="0" y="75" width="30" height="20" fill="rgba(203,78,90,1)" />
    <text x="35" y="90">60 bis 80</text>
    
    <rect x="0" y="100" width="30" height="20" fill="rgba(138,26,39,1)" />
    <text x="35" y="115">80 bis 100</text>
  </g>
  
  <!-- Erklärung -->
  <text x="10" y="150">Einheit: %</text>
  <text x="10" y="170">Hinweis: ∆W bezeichnet die Abweichung vom</text>
  <text x="10" y="185">natürlichen Wasserhaushalt in Prozent.</text>
</svg>
